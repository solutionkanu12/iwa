[package]
name = "iwa"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.18.0"

# Toolchain pinned to the verified STRK20 protocol repo
# (starkware-libs/starknet-privacy `.tool-versions` + workspace Scarb.toml):
#   scarb 2.18.0
#   starknet-foundry 0.63.0
#   starknet = "2.17.0"
#   snforge_std = "0.63.0"
#   assert_macros = "2.17.0"
# Do not bump these to "latest" without re-checking that repo.

[dependencies]
openzeppelin = "3.0.0"
privacy = { git = "https://github.com/starkware-libs/starknet-privacy", rev = "66e3caae8c0201227a6719696d004e30d90aea65" }
starknet = "2.17.0"

[dev-dependencies]
assert_macros = "2.17.0"
openzeppelin_token = "3.0.0"
snforge_std = "0.63.0"

[features]
test_erc20 = []

[lib]

[[target.starknet-contract]]
sierra = true

[scripts]
test = "snforge test --features test_erc20"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool.fmt]
sort-module-level-items = true
